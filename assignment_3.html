<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Assignment 3 Forms."
    >

    <title>Assignment 3 - Forms</title>

    <link rel="stylesheet" href="css/main-theme.css">
    <link rel="stylesheet" href="css/assignment_3_forms.css">
</head>

<body>

    <header>
        <nav>
            <a class="logo" href="index.html">
                <img src="assets/MoonAndStar.png" alt="Moon and Star">
            </a>

            <a href="index.html">Home</a>
            <a href="assignment_1.html">About</a>
            <a href="assignment_3.html">Forms</a>
        </nav>
    </header>

    <main>

        <h1>Assignment 3 - Forms</h1>

        <p>
            Please complete the form below. All fields are required.
        </p>

        <form id="contactForm">

            <fieldset>
                <legend>Personal Information</legend>

                <p>
                    <label for="firstName">First Name:</label>

                    <input
                        type="text"
                        id="firstName"
                        name="firstName"
                        required
                    >
                </p>

                <p>
                    <label for="lastName">Last Name:</label>

                    <input
                        type="text"
                        id="lastName"
                        name="lastName"
                        required
                    >
                </p>

                <p>
                    <label for="birthdate">Birth Date:</label>

                    <input
                        type="date"
                        id="birthdate"
                        name="birthdate"
                        required
                    >
                </p>

            </fieldset>


            <fieldset>

                <legend>Address</legend>

                <p>
                    <label for="address">Street Address:</label>

                    <input
                        type="text"
                        id="address"
                        name="address"
                        required
                    >
                </p>

                <p>
                    <label for="city">City:</label>

                    <input
                        type="text"
                        id="city"
                        name="city"
                        required
                    >
                </p>

                <p>
                    <label for="state">State:</label>

                    <select
                        id="state"
                        name="state"
                        required
                    >

                        <option value="">Select State</option>

                        <option value="AL">Alabama</option>
                        <option value="AK">Alaska</option>
                        <option value="AZ">Arizona</option>
                        <option value="AR">Arkansas</option>
                        <option value="CA">California</option>
                        <option value="CO">Colorado</option>
                        <option value="CT">Connecticut</option>
                        <option value="DE">Delaware</option>
                        <option value="FL">Florida</option>
                        <option value="GA">Georgia</option>
                        <option value="HI">Hawaii</option>
                        <option value="ID">Idaho</option>
                        <option value="IL">Illinois</option>
                        <option value="IN">Indiana</option>
                        <option value="IA">Iowa</option>
                        <option value="KS">Kansas</option>
                        <option value="KY">Kentucky</option>
                        <option value="LA">Louisiana</option>
                        <option value="ME">Maine</option>
                        <option value="MD">Maryland</option>
                        <option value="MA">Massachusetts</option>
                        <option value="MI">Michigan</option>
                        <option value="MN">Minnesota</option>
                        <option value="MS">Mississippi</option>
                        <option value="MO">Missouri</option>
                        <option value="MT">Montana</option>
                        <option value="NE">Nebraska</option>
                        <option value="NV">Nevada</option>
                        <option value="NH">New Hampshire</option>
                        <option value="NJ">New Jersey</option>
                        <option value="NM">New Mexico</option>
                        <option value="NY">New York</option>
                        <option value="NC">North Carolina</option>
                        <option value="ND">North Dakota</option>
                        <option value="OH">Ohio</option>
                        <option value="OK">Oklahoma</option>
                        <option value="OR">Oregon</option>
                        <option value="PA">Pennsylvania</option>
                        <option value="RI">Rhode Island</option>
                        <option value="SC">South Carolina</option>
                        <option value="SD">South Dakota</option>
                        <option value="TN">Tennessee</option>
                        <option value="TX">Texas</option>
                        <option value="UT">Utah</option>
                        <option value="VT">Vermont</option>
                        <option value="VA">Virginia</option>
                        <option value="WA">Washington</option>
                        <option value="WV">West Virginia</option>
                        <option value="WI">Wisconsin</option>
                        <option value="WY">Wyoming</option>

                    </select>
                </p>

                <p>
                    <label for="zip">ZIP Code:</label>

                    <input
                        type="text"
                        id="zip"
                        name="zip"
                        maxlength="5"
                        pattern="[0-9]{5}"
                        title="Enter a 5-digit ZIP code."
                        required
                    >
                </p>

            </fieldset>


            <fieldset>

                <legend>Contact Information</legend>

                <p>
                    <label for="phone">Phone Number:</label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="(000)000-0000"
                        maxlength="13"
                        required
                    >
                </p>

                <p>
                    <label for="email">Email Address:</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="name@example.com"
                        required
                    >
                </p>

            </fieldset>


            <fieldset>

                <legend>Message</legend>

                <p>
                    <label for="message">Your Message:</label>

                    <textarea
                        id="message"
                        name="message"
                        rows="6"
                        required
                    ></textarea>
                </p>

            </fieldset>


            <fieldset>

                <legend>Confirmation</legend>

                <p>
                    <label for="confirm">
                        What is 5 + 3?
                    </label>

                    <input
                        type="number"
                        id="confirm"
                        name="confirm"
                        required
                    >
                </p>

            </fieldset>


            <p id="errorMessage"></p>


            <p>
                <button type="submit">
                    Submit
                </button>
            </p>

        </form>


        <p>
            <a href="index.html">Return to Menu</a>
        </p>

    </main>

    <script src="js/forms.js"></script>

</body>
</html>
